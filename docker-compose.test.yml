version: '3.8'

# Test-only stack. Uses non-default ports so it can coexist with a local
# Postgres/Redis on the standard ports. Credentials come from the host .env
# via the same ${VAR:?required} interpolation as the dev stack.
services:
  postgres:
    image: postgres:15-alpine
    container_name: educonnect_test_postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: educonnect_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educonnect_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: educonnect_test_redis
    restart: "no"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
